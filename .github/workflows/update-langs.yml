name: Update Top Languages

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger via Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-langs.mjs'

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Top Languages SVG
        run: node scripts/generate-langs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          if git diff --staged --quiet; then
            echo "No changes in top-langs.svg"
          else
            git commit -m "chore(stats): update top languages card [skip ci]"
            git push
          fi
