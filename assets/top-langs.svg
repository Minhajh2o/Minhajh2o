<svg xmlns="http://www.w3.org/2000/svg" width="340" height="165" viewBox="0 0 340 165" fill="none">
  <style>
    .title { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; fill: #6C63FF; }
    .lang-name { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; fill: #c9d1d9; }
    .lang-pct { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; fill: #8b949e; text-anchor: end; }
  </style>

  <rect width="340" height="165" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <text x="30" y="34" class="title">Most Used Languages</text>

  <!-- Progress Bar Container -->
  <rect x="30" y="52" width="280" height="8" rx="4" fill="#21262d" />
  
  <g clip-path="url(#bar-clip)">
    <clipPath id="bar-clip">
      <rect x="30" y="52" width="280" height="8" rx="4" />
    </clipPath>
    <g>
      <rect x="30.0" y="52" width="133.2" height="8" fill="#f1e05a" />
      <rect x="163.2" y="52" width="71.4" height="8" fill="#e34c26" />
      <rect x="234.6" y="52" width="50.3" height="8" fill="#3572A5" />
      <rect x="285.0" y="52" width="20.2" height="8" fill="#563d7c" />
      <rect x="305.2" y="52" width="4.8" height="8" fill="#f34b7d" />
    </g>
  </g>

  <!-- Language Breakdown -->
  
      <g transform="translate(30, 82)">
        <circle cx="5" cy="5" r="4.5" fill="#f1e05a" />
        <text x="16" y="8.5" class="lang-name">JavaScript</text>
        <text x="120" y="8.5" class="lang-pct">47.6%</text>
      </g>
      <g transform="translate(30, 106)">
        <circle cx="5" cy="5" r="4.5" fill="#3572A5" />
        <text x="16" y="8.5" class="lang-name">Python</text>
        <text x="120" y="8.5" class="lang-pct">18.0%</text>
      </g>
      <g transform="translate(30, 130)">
        <circle cx="5" cy="5" r="4.5" fill="#f34b7d" />
        <text x="16" y="8.5" class="lang-name">C++</text>
        <text x="120" y="8.5" class="lang-pct">1.7%</text>
      </g>
  
      <g transform="translate(175, 82)">
        <circle cx="5" cy="5" r="4.5" fill="#e34c26" />
        <text x="16" y="8.5" class="lang-name">HTML</text>
        <text x="120" y="8.5" class="lang-pct">25.5%</text>
      </g>
      <g transform="translate(175, 106)">
        <circle cx="5" cy="5" r="4.5" fill="#563d7c" />
        <text x="16" y="8.5" class="lang-name">CSS</text>
        <text x="120" y="8.5" class="lang-pct">7.2%</text>
      </g>
</svg>